# Local DNS cache + encrypted DNS. Copied by install.sh, which also points
# /etc/resolv.conf at resolved's stub (127.0.0.53).
[Resolve]
# Cloudflare, then Quad9. The #name is the TLS server name.
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 9.9.9.9#dns.quad9.net
FallbackDNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
# Use these for every name, not the router's/ISP's DNS.
Domains=~.
# Encrypted when the server supports it (both do); falls back to plain DNS
# instead of failing, so hotel/café login pages still work.
DNSOverTLS=opportunistic
Cache=yes
