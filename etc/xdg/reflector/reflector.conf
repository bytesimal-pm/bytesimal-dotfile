# Reflector config: ranks pacman mirrors by download speed.
# Copied to /etc/xdg/reflector/reflector.conf by install.sh (not linked:
# reflector.service runs as root). reflector.timer reruns it weekly.
--save /etc/pacman.d/mirrorlist
--protocol https
# Nearby countries (Bangkok); edit for another location.
--country Thailand,Singapore,Vietnam,Malaysia,Indonesia,Hong Kong,Japan
# Only mirrors synced in the last 12 hours, the 20 most recent, fastest first.
--age 12
--latest 20
--sort rate
