# TCP tuning for a 500 Mbps line where most servers are far away
# (Bangkok -> Europe/US: 190-260 ms). Copied to /etc/sysctl.d by install.sh.
# Mostly helps what this machine sends (uploads, git push, screen sharing):
# download speed is set by the server's side of TCP.

# BBR: keeps sending speed up on long routes that lose some packets (cubic
# halves its speed on every loss). fq is the qdisc BBR is designed to pace with.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# A connection needs speed x round trip in flight: 500 Mbps x 250 ms ~ 16 MB.
# The default send max (4 MB) caps one upload to Europe/US near 130 Mbps.
# (Recent kernels already allow 32 MB for receiving; set here so older ones match.)
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# Fast Open (client + server): skips a round trip when reconnecting.
net.ipv4.tcp_fastopen = 3
# Find a working packet size when a router drops ICMP (stalled connections).
net.ipv4.tcp_mtu_probing = 1
# Don't drop back to a small window after a pause (e.g. between video chunks).
net.ipv4.tcp_slow_start_after_idle = 0
