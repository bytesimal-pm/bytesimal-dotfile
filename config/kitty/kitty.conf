# Kitty — monochrome, transparent (matches the anime-eye wallpaper)

# Font
font_family      JetBrainsMono Nerd Font
font_size        12.0

# Shell
shell zsh

# Window
background_opacity      0.75
window_padding_width    12
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no

# Cursor
cursor_shape               beam
cursor_blink_interval      0.5
cursor_stop_blinking_after 10

# Tab bar
tab_bar_edge           bottom
tab_bar_style          powerline
tab_powerline_style    slanted
active_tab_foreground   #000000
active_tab_background   #ffffff
active_tab_font_style   bold
inactive_tab_foreground #707070
inactive_tab_background #1a1a1a

# Colors — black and white (grey only for dim text: color8)
foreground           #ffffff
background           #000000
cursor               #ffffff
cursor_text_color    #000000
selection_foreground #000000
selection_background #ffffff
url_color            #ffffff

active_border_color   #ffffff
inactive_border_color #333333

# black
color0  #000000
color8  #808080
# red (white)
color1  #ffffff
color9  #ffffff
# green (white)
color2  #ffffff
color10 #ffffff
# yellow (white)
color3  #ffffff
color11 #ffffff
# blue (white)
color4  #ffffff
color12 #ffffff
# magenta (white)
color5  #ffffff
color13 #ffffff
# cyan (white)
color6  #ffffff
color14 #ffffff
# white
color7  #ffffff
color15 #ffffff
