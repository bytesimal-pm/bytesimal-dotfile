<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Thai text uses Sarabun (local/share/fonts/sarabun: 8 weights + italics).
     Linked to ~/.config/fontconfig/fonts.conf. -->
<fontconfig>

    <!-- Fallback: fonts without Thai glyphs (JetBrains Mono, Adwaita (GTK), and the Noto
         fonts behind sans-serif/serif/monospace) get their Thai characters from Sarabun instead of Noto Sans Thai -->
    <alias binding="same">
        <family>JetBrainsMono Nerd Font</family>
        <accept><family>Sarabun</family></accept>
    </alias>
    <alias binding="same">
        <family>Noto Sans</family>
        <accept><family>Sarabun</family></accept>
    </alias>
    <alias binding="same">
        <family>Noto Serif</family>
        <accept><family>Sarabun</family></accept>
    </alias>
    <alias binding="same">
        <family>Noto Sans Mono</family>
        <accept><family>Sarabun</family></accept>
    </alias>
    <alias binding="same">
        <family>Adwaita Sans</family>
        <accept><family>Sarabun</family></accept>
    </alias>
    <alias binding="same">
        <family>Adwaita Mono</family>
        <accept><family>Sarabun</family></accept>
    </alias>

    <!-- Text marked as Thai (lang="th" pages, Thai UI): Sarabun first -->
    <match target="pattern">
        <test name="lang" compare="contains"><string>th</string></test>
        <test qual="any" name="family"><string>sans-serif</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Sarabun</string></edit>
    </match>
    <match target="pattern">
        <test name="lang" compare="contains"><string>th</string></test>
        <test qual="any" name="family"><string>serif</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Sarabun</string></edit>
    </match>

    <!-- Sarabun last in every family list. Chromium/Electron (Discord) look
         up missing characters with no family at all, only the character: among
         fonts that have it, a listed family wins, so Thai gets Sarabun instead
         of FreeSerif. Being last, it never replaces a font that was asked for. -->
    <match target="pattern">
        <edit name="family" mode="append_last" binding="weak"><string>Sarabun</string></edit>
    </match>

    <!-- Thai in monospace text: Sarabun as the fallback (appended, so the
         Latin part stays monospace) instead of FreeSerif -->
    <match target="pattern">
        <test name="lang" compare="contains"><string>th</string></test>
        <test qual="any" name="family"><string>monospace</string></test>
        <edit name="family" mode="append" binding="weak"><string>Sarabun</string></edit>
    </match>

</fontconfig>
